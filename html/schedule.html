<div class="eph-schedule-panel" id="eph-schedule-panel" style="display: none;">
    <!-- Resize Handles -->
    <div class="eph-panel-resize-handle eph-panel-resize-nw" data-dir="nw"></div>
    <div class="eph-panel-resize-handle eph-panel-resize-ne" data-dir="ne"></div>
    <div class="eph-panel-resize-handle eph-panel-resize-sw" data-dir="sw"></div>
    <div class="eph-panel-resize-handle eph-panel-resize-se" data-dir="se"></div>
    <div class="eph-panel-resize-handle eph-panel-resize-n" data-dir="n"></div>
    <div class="eph-panel-resize-handle eph-panel-resize-e" data-dir="e"></div>
    <div class="eph-panel-resize-handle eph-panel-resize-s" data-dir="s"></div>
    <div class="eph-panel-resize-handle eph-panel-resize-w" data-dir="w"></div>

    <div class="eph-schedule-header drag-handle" id="eph-schedule-drag-handle">
        <div class="eph-schedule-title">
            <i class="fa-solid fa-calendar-alt"></i> Ephemeris Schedule
        </div>
        <div class="eph-schedule-controls">
            <div class="menu_button interactable" id="eph-schedule-toggle-format" title="Toggle Time Format">
                <i class="fa-solid fa-clock"></i>
            </div>
            <div class="menu_button interactable" id="eph-schedule-close" title="Close">
                <i class="fa-solid fa-times"></i>
            </div>
        </div>
    </div>
    
    <div class="eph-schedule-toolbar">
        <select id="eph-schedule-calendar-select" class="text_pole" title="Display Calendar"></select>
        <input type="text" id="eph-schedule-search" class="text_pole" placeholder="Search events..." />
    </div>

    <div class="eph-schedule-tabs">
        <div class="eph-schedule-tab active" data-tab="upcoming">Upcoming Schedule</div>
        <div class="eph-schedule-tab" data-tab="past">Past Chronicle</div>
    </div>

    <div class="eph-schedule-content-wrapper">
        <div class="eph-schedule-content" id="eph-schedule-list">
            <!-- Events will be injected here -->
        </div>
    </div>

    <div class="eph-schedule-footer">
        <div class="eph-scroll-to-label">Jump to:</div>
        <select id="eph-scroll-unit" class="text_pole" title="Select Unit"></select>
        <input type="text" id="eph-scroll-value" class="text_pole" placeholder="Value..." />
    </div>

</div>
