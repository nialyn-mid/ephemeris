<div id="ephemeris-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Ephemeris Calendars</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="ephemeris-settings-container">

                <!-- DATA SECTION -->
                <div class="ephemeris-drawer">
                    <div class="ephemeris-drawer-header">
                        <b>Data & Calendars</b>
                        <i class="fa-solid fa-chevron-up"></i>
                    </div>
                    <div class="ephemeris-drawer-content">
                        <div class="setup-item">
                            <button id="ephemeris-open-global-calendars" class="menu_button ephemeris-full-width">Edit
                                Global Calendars</button>
                        </div>
                        <div class="setup-item">
                            <button id="ephemeris-open-chat-calendars" class="menu_button ephemeris-full-width">Edit
                                Chat Calendars</button>
                        </div>
                        <div class="setup-item">
                            <button id="ephemeris-open-chat-events" class="menu_button ephemeris-full-width">Edit
                                Chat Events</button>
                        </div>
                        <div class="setup-item">
                            <button id="ephemeris-reset-global-calendars" class="menu_button ephemeris-full-width" style="color: var(--ephemeris-danger);">Reset Global Calendars</button>
                        </div>
                        <div class="setup-item">
                            <small><b>Log Level</b></small>
                            <select id="ephemeris-log-level" class="text_pole">
                                <option value="0">Error</option>
                                <option value="1">Warn</option>
                                <option value="2">Info</option>
                                <option value="3">Debug</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- PROMPT INJECTION SECTION -->
                <div class="ephemeris-drawer">
                    <div class="ephemeris-drawer-header">
                        <b>Prompt Injection</b>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="ephemeris-drawer-content" style="display: none;">
                        <div class="setup-item">
                            <label for="ephemeris-injection-enabled">Enable Injection</label>
                            <input type="checkbox" id="ephemeris-injection-enabled">
                        </div>

                        <div class="setup-item">
                            <label for="ephemeris-inject-events">Inject Events List</label>
                            <input type="checkbox" id="ephemeris-inject-events">
                        </div>
                        <div class="setup-item">
                            <small>Inject Calendar Details</small>
                            <select id="ephemeris-inject-calendar-details" class="text_pole">
                                <option value="none">None</option>
                                <option value="both">Both</option>
                                <option value="chat">Chat Only</option>
                                <option value="global">Global Only</option>
                            </select>
                        </div>

                        <div class="setup-item">
                            <small>Summarization Strategy</small>
                            <select id="ephemeris-summarization-strategy" class="text_pole">
                                <option value="all">Show All</option>
                                <option value="significant">Significance Dropoff</option>
                            </select>
                        </div>

                        <!-- Significance Distances Sub-Drawer -->
                        <div id="ephemeris-lod-drawer" class="ephemeris-drawer" style="display: none;">
                            <div class="ephemeris-drawer-header" style="background: rgba(0,0,0,0.1); padding: 6px 8px;">
                                <small>Significance LOD Distances</small>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                            <div class="ephemeris-drawer-content" id="ephemeris-lod-distances-list"
                                style="display: none;">
                                <!-- Will be populated by JS -->
                            </div>
                        </div>

                        <div class="setup-item">
                            <small>Backward Range (Seconds)</small>
                            <input type="number" id="ephemeris-range-backward" class="text_pole" min="0">
                        </div>

                        <div class="setup-item">
                            <small>Forward Range (Seconds)</small>
                            <input type="number" id="ephemeris-range-forward" class="text_pole" min="0">
                        </div>

                        <hr>

                        <div class="setup-item">
                            <label for="ephemeris-reminders-enabled">Enable Reminders</label>
                            <input type="checkbox" id="ephemeris-reminders-enabled">
                        </div>

                        <div class="setup-item">
                            <small>Reminder Distance (Seconds)</small>
                            <input type="number" id="ephemeris-reminders-distance" class="text_pole" min="0">
                        </div>

                        <hr>

                        <div class="setup-item">
                            <label for="ephemeris-notices-enabled">Enable Completion Notices</label>
                            <input type="checkbox" id="ephemeris-notices-enabled">
                        </div>

                        <div class="setup-item">
                            <small>Notice Duration (Seconds)</small>
                            <input type="number" id="ephemeris-notices-duration" class="text_pole" min="0">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
