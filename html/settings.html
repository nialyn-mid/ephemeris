<div id="ephemeris-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Ephemeris Calendars</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="ephemeris-settings-container">

                <!-- DATA SECTION -->
                <div class="ephemeris-drawer">
                    <div class="ephemeris-drawer-header">
                        <b>Data & Calendars</b>
                        <i class="fa-solid fa-chevron-up"></i>
                    </div>
                    <div class="ephemeris-drawer-content">
                        <small><b>GLOBAL</b></small>
                        <div class="setup-item">
                            <button id="ephemeris-open-global-calendars" class="menu_button ephemeris-full-width">Edit Global Calendars</button>
                        </div>
                        <div class="setup-item">
                            <button id="ephemeris-reset-global-calendars" class="menu_button ephemeris-full-width"
                                style="color: var(--ephemeris-danger);">Reset Global Calendars</button>
                        </div>

                        <hr>

                        <small><b>CHAT</b></small>
                        <div class="setup-item">
                            <button id="ephemeris-open-chat-calendars" class="menu_button ephemeris-full-width">Edit Chat Calendars</button>
                        </div>
                        <div class="setup-item">
                            <button id="ephemeris-open-chat-events" class="menu_button ephemeris-full-width">Edit Chat Events</button>
                        </div>
                        <div class="setup-item">
                            <button id="ephemeris-open-chat-time" class="menu_button ephemeris-full-width">Edit Chat Time</button>
                        </div>

                        <hr>

                        <div class="setup-item">
                            <small><b>Log Level</b></small>
                            <select id="ephemeris-log-level" class="text_pole">
                                <option value="0">Error</option>
                                <option value="1">Warn</option>
                                <option value="2">Info</option>
                                <option value="3">Debug</option>
                            </select>
                        </div>
                    </div>

                </div>

                <!-- PROMPT INJECTION SECTION -->
                <div class="ephemeris-drawer">
                    <div class="ephemeris-drawer-header">
                        <b>Prompt Injection</b>
                        <i class="fa-solid fa-chevron-down"></i>
                    </div>
                    <div class="ephemeris-drawer-content" style="display: none;">
                        <div class="setup-item">
                            <label for="ephemeris-injection-enabled">Enable Injection</label>
                            <input type="checkbox" id="ephemeris-injection-enabled">
                        </div>

                        <hr>

                        <div class="setup-item">
                            <small>Inject Calendar Details</small>
                            <select id="ephemeris-inject-calendar-details" class="text_pole">
                                <option value="none">None</option>
                                <option value="both">Both</option>
                                <option value="chat">Chat Only</option>
                                <option value="global">Global Only</option>
                            </select>
                        </div>
                        <div class="setup-item">
                            <small>Calendar Injection Frequency</small>
                            <select id="ephemeris-inject-calendar-details-frequency" class="text_pole">
                                <option value="every">Every Request</option>
                                <option value="turn">Once Per Turn</option>
                                <option value="chat">Once Only</option>
                            </select>
                        </div>

                        <hr>

                        <div class="setup-item">
                            <label for="ephemeris-inject-events">Inject Events List</label>
                            <input type="checkbox" id="ephemeris-inject-events">
                        </div>

                        <div class="setup-item">
                            <small>Summarization Strategy</small>
                            <select id="ephemeris-summarization-strategy" class="text_pole">
                                <option value="all">Show All</option>
                                <option value="significant">Significance Dropoff</option>
                            </select>
                        </div>

                        <!-- Significance Distances Sub-Drawer -->
                        <div id="ephemeris-lod-drawer" class="ephemeris-drawer" style="display: none;">
                            <div class="ephemeris-drawer-header" style="background: rgba(0,0,0,0.1); padding: 6px 8px;">
                                <small>Significance LOD Distances</small>
                                <i class="fa-solid fa-chevron-down"></i>
                            </div>
                            <div class="ephemeris-drawer-content" id="ephemeris-lod-distances-list"
                                style="display: none;">
                                <!-- Will be populated by JS -->
                            </div>
                        </div>

                        <div class="ephemeris-slider-row" style="display: flex; flex-wrap: wrap; margin-bottom: 10px;">
                            <div
                                class="alignitemscenter flex-container flexFlowColumn flexGrow flexShrink gap0 flexBasis48p">
                                <small><span style="font-weight: bold; margin-bottom: 2px; display: block;">Backward
                                        Range</span></small>
                                <input class="neo-range-slider" type="range" id="ephemeris-range-backward" min="0"
                                    max="31536000" step="3600">
                                <input class="neo-range-input" type="number" id="ephemeris-range-backward_value"
                                    data-for="ephemeris-range-backward" min="0" max="31536000" step="3600">
                            </div>
                            <div
                                class="alignitemscenter flex-container flexFlowColumn flexGrow flexShrink gap0 flexBasis48p">
                                <small><span style="font-weight: bold; margin-bottom: 2px; display: block;">Forward
                                        Range</span></small>
                                <input class="neo-range-slider" type="range" id="ephemeris-range-forward" min="0"
                                    max="31536000" step="3600">
                                <input class="neo-range-input" type="number" id="ephemeris-range-forward_value"
                                    data-for="ephemeris-range-forward" min="0" max="31536000" step="3600">
                            </div>
                        </div>

                        <hr>

                        <div class="setup-item">
                            <label for="ephemeris-reminders-enabled">Enable Reminders</label>
                            <input type="checkbox" id="ephemeris-reminders-enabled">
                        </div>

                        <div class="ephemeris-slider-row" style="margin-bottom: 10px;">
                            <div
                                class="alignitemscenter flex-container flexFlowColumn flexGrow flexShrink gap0 flexBasis48p">
                                <small><span style="font-weight: bold; margin-bottom: 2px; display: block;">Reminder
                                        Distance</span></small>
                                <input class="neo-range-slider" type="range" id="ephemeris-reminders-distance" min="0"
                                    max="2592000" step="3600">
                                <input class="neo-range-input" type="number" id="ephemeris-reminders-distance_value"
                                    data-for="ephemeris-reminders-distance" min="0" max="2592000" step="3600">
                            </div>
                        </div>

                        <div class="setup-item">
                            <label for="ephemeris-notices-enabled">Enable Completion Notices</label>
                            <input type="checkbox" id="ephemeris-notices-enabled">
                        </div>

                        <div class="ephemeris-slider-row" style="margin-bottom: 10px;">
                            <div
                                class="alignitemscenter flex-container flexFlowColumn flexGrow flexShrink gap0 flexBasis48p">
                                <small><span style="font-weight: bold; margin-bottom: 2px; display: block;">Notice
                                        Duration</span></small>
                                <input class="neo-range-slider" type="range" id="ephemeris-notices-duration" min="0"
                                    max="604800" step="3600">
                                <input class="neo-range-input" type="number" id="ephemeris-notices-duration_value"
                                    data-for="ephemeris-notices-duration" min="0" max="604800" step="3600">
                            </div>
                        </div>

                        <div class="ephemeris-slider-row" style="margin-bottom: 10px;">
                            <div
                                class="alignitemscenter flex-container flexFlowColumn flexGrow flexShrink gap0 flexBasis48p">
                                <small><span style="font-weight: bold; margin-bottom: 2px; display: block;">Significance
                                        Distance Multiplier</span></small>
                                <input class="neo-range-slider" type="range" id="ephemeris-significance-multiplier"
                                    min="0" max="10" step="0.1">
                                <input class="neo-range-input" type="number"
                                    id="ephemeris-significance-multiplier_value"
                                    data-for="ephemeris-significance-multiplier" min="0" max="10" step="0.1">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
